
services:
  kibana:
    image: docker.elastic.co/kibana/kibana:8.19.3
    container_name: east-india-kibana
    environment:
      XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY: ${KIBANA_ENCRYPTION_KEY}
      ELASTICSEARCH_HOSTS: '["http://elasticsearch:9200"]'
      ELASTICSEARCH_USERNAME: kibana_system
      ELASTICSEARCH_PASSWORD: ${KIBANA_PASSWORD}
    ports:
      - "127.0.0.1:5601:5601"
    depends_on:
      - elasticsearch
    mem_limit: 2g
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.3
    container_name: east-india-es
    environment:
      discovery.type: single-node
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "false"
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD}
      ES_JAVA_OPTS: "-Xms2g -Xmx2g"
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    mem_limit: 4g
    restart: unless-stopped

  geoserver:
    image: docker.osgeo.org/geoserver:2.27.2
    container_name: east-india-geoserver
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./data:/opt/geoserver_data/files:ro
    mem_limit: 2g
    restart: unless-stopped

volumes:
  esdata:
